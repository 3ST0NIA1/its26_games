<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banaani Simulaator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #121218;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #333344;
        }
        canvas {
            display: block;
            background-color: #1e1e28;
            cursor: default;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = "MENU"; // "MENU", "GAME", "GAME_OVER"

// Skinid (Kollane klassikaline esimesena, Käe-banaan keskel)
const BANANA_SKINS = [
    { name: "Kollane (Klassikaline)", color: "#ffe135", type: "classic" },
    { name: "Roheline (Toores)", color: "#7ccd32", type: "classic" },
    { name: "Anatoomiline Käe-Banaan 🖐️", color: "#f1c27d", type: "hand" },
    { name: "Pruun (Üleküpsenud)", color: "#6e3c14", type: "classic" },
    { name: "Roosa (Rave)", color: "#ff69b4", type: "classic" }
];
let selectedSkinIndex = 0;

// Mängu parameetrid
let level = 1;
let cutsCount = 0;
const TARGET_CUTS = 50;
let timeLeft = 60;
let timerInterval = null;

// Lõikelaua värvid tasemete kaupa
const BOARD_COLORS = [
    { wood: '#a0522d', border: '#654321', name: 'Klassikaline Puit' },
    { wood: '#2e4053', border: '#1b2631', name: 'Tumesinine Marmor' },
    { wood: '#1e8449', border: '#145a32', name: 'Smaragdroheline' },
    { wood: '#7d6608', border: '#4d3e05', name: 'Kuldne Puit' },
    { wood: '#6c3483', border: '#4a235a', name: 'Müstiline Violetne' },
    { wood: '#ba4a00', border: '#7e2e00', name: 'Marmorpruun' }
];

let cuts = []; // Hoiab lõigete punkte: [{ points: [{x, y}, ...] }]
let currentCut = null; // Hetkel tõmmatav lõige
let juiceDrips = [];
let isCutting = false;

let knife = {
    x: 680,
    y: 420,
    width: 90,
    height: 35,
    isHeld: false
};

let mousePos = { x: 0, y: 0 };

function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;

    if (knife.isHeld) {
        knife.x = mousePos.x - 20;
        knife.y = mousePos.y - 10;

        if (isCutting && currentCut) {
            const lastPt = currentCut.points[currentCut.points.length - 1];
            const dist = Math.hypot(mousePos.x - lastPt.x, mousePos.y - lastPt.y);
            
            if (dist > 5) {
                currentCut.points.push({ x: mousePos.x, y: mousePos.y });

                // Mahlatilgad lõikejoonele
                for (let i = 0; i < 2; i++) {
                    juiceDrips.push({
                        x: mousePos.x + (Math.random() * 10 - 5),
                        y: mousePos.y + (Math.random() * 10 - 5),
                        radius: Math.random() * 4 + 2,
                        speedY: Math.random() * 1.5 + 0.5
                    });
                }
            }
        }
    }
});

canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
        if (gameState === "MENU") {
            startGame();
        } else if (gameState === "GAME") {
            if (!knife.isHeld) {
                if (mousePos.x >= knife.x - 20 && mousePos.x <= knife.x + knife.width &&
                    mousePos.y >= knife.y - 20 && mousePos.y <= knife.y + knife.height) {
                    knife.isHeld = true;
                }
            } else {
                // Alusta uut lõiget
                isCutting = true;
                currentCut = { points: [{ x: mousePos.x, y: mousePos.y }] };
            }
        } else if (gameState === "GAME_OVER") {
            gameState = "MENU";
        }
    }
});

canvas.addEventListener('mouseup', (e) => {
    if (e.button === 0 && isCutting) {
        if (currentCut && currentCut.points.length > 1) {
            cuts.push(currentCut);
            cutsCount++; // Lisandub TÄPSELT 1 kriimustus ühe pideva tõmbe eest

            if (cutsCount >= TARGET_CUTS) {
                nextLevel();
            }
        }
        isCutting = false;
        currentCut = null;
    }
});

canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (knife.isHeld) {
        knife.isHeld = false;
        isCutting = false;
        currentCut = null;
        knife.x = 680;
        knife.y = 420;
    }
});

window.addEventListener('keydown', (e) => {
    if (gameState === "MENU") {
        if (e.key === "ArrowRight") {
            selectedSkinIndex = (selectedSkinIndex + 1) % BANANA_SKINS.length;
        } else if (e.key === "ArrowLeft") {
            selectedSkinIndex = (selectedSkinIndex - 1 + BANANA_SKINS.length) % BANANA_SKINS.length;
        } else if (e.key === "Enter" || e.key === " ") {
            startGame();
        }
    } else if (gameState === "GAME") {
        if (e.key === "Escape") {
            stopTimer();
            gameState = "MENU";
        } else if (e.key === "c" || e.key === "C") {
            cuts = [];
            juiceDrips = [];
            cutsCount = 0;
        }
    }
});

function startGame() {
    level = 1;
    resetLevelData();
    gameState = "GAME";
    startTimer();
}

function resetLevelData() {
    cutsCount = 0;
    cuts = [];
    currentCut = null;
    juiceDrips = [];
    timeLeft = Math.max(20, 60 - (level - 1) * 5);
    knife.isHeld = false;
    knife.x = 680;
    knife.y = 420;
    isCutting = false;
}

function startTimer() {
    stopTimer();
    timerInterval = setInterval(() => {
        if (gameState === "GAME") {
            timeLeft--;
            if (timeLeft <= 0) {
                stopTimer();
                gameState = "GAME_OVER";
            }
        }
    }, 1000);
}

function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
}

function nextLevel() {
    level++;
    resetLevelData();
}

function getBoardColor(lvl) {
    const idx = (lvl - 1) % BOARD_COLORS.length;
    return BOARD_COLORS[idx];
}

function drawBanana(cx, cy, skin) {
    ctx.save();

    if (skin.type === "hand") {
        ctx.fillStyle = skin.color;
        ctx.strokeStyle = "#b5834a";
        ctx.lineWidth = 4;
        ctx.lineJoin = "round";

        ctx.beginPath();
        ctx.moveTo(cx - 140, cy + 60);
        ctx.bezierCurveTo(cx - 60, cy + 90, cx + 20, cy + 60, cx + 80, cy + 20);

        ctx.lineTo(cx + 105, cy + 30);
        ctx.lineTo(cx + 120, cy + 15);
        ctx.lineTo(cx + 110, cy + 0);

        ctx.lineTo(cx + 130, cy - 10);
        ctx.lineTo(cx + 120, cy - 25);

        ctx.lineTo(cx + 135, cy - 40);
        ctx.lineTo(cx + 120, cy - 50);

        ctx.lineTo(cx + 110, cy - 55);
        ctx.lineTo(cx + 95, cy - 40);

        ctx.lineTo(cx + 75, cy - 45);
        ctx.lineTo(cx + 60, cy - 25);

        ctx.bezierCurveTo(cx + 10, cy - 10, cx - 50, cy + 10, cx - 120, cy + 10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = "rgba(180, 100, 50, 0.25)";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(cx - 110, cy + 35);
        ctx.bezierCurveTo(cx - 40, cy + 45, cx + 30, cy + 25, cx + 70, cy - 5);
        ctx.stroke();

    } else {
        ctx.beginPath();
        ctx.arc(cx, cy - 20, 115, 0.2 * Math.PI, 0.8 * Math.PI, false);
        ctx.lineWidth = 48;
        ctx.strokeStyle = skin.color;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy - 20, 115, 0.22 * Math.PI, 0.78 * Math.PI, false);
        ctx.lineWidth = 10;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.stroke();

        ctx.fillStyle = '#4a2e13';
        ctx.beginPath();
        ctx.arc(cx - 100, cy + 50, 9, 0, Math.PI * 2);
        ctx.arc(cx + 100, cy + 50, 9, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function drawKnifeObj(k) {
    ctx.save();
    
    ctx.fillStyle = '#e0e0e0';
    ctx.strokeStyle = '#555555';
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    ctx.moveTo(k.x, k.y);
    ctx.lineTo(k.x + 60, k.y - 18);
    ctx.lineTo(k.x + 50, k.y + 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(k.x + 5, k.y - 2);
    ctx.lineTo(k.x + 55, k.y - 16);
    ctx.lineTo(k.x + 45, k.y + 5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(k.x - 30, k.y - 8, 32, 14);

    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.arc(k.x - 20, k.y, 2, 0, Math.PI * 2);
    ctx.arc(k.x - 8, k.y, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function renderStroke(cutObj) {
    if (!cutObj || cutObj.points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(cutObj.points[0].x, cutObj.points[0].y);
    for (let i = 1; i < cutObj.points.length; i++) {
        ctx.lineTo(cutObj.points[i].x, cutObj.points[i].y);
    }
    ctx.stroke();
}

function renderMenu() {
    ctx.fillStyle = '#121218';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffe135';
    ctx.font = 'bold 46px Arial';
    ctx.textAlign = 'center';
    ctx.fillText("BANAANI SIMULAATOR", canvas.width / 2, 90);

    const skin = BANANA_SKINS[selectedSkinIndex];
    ctx.font = '22px Arial';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`< Banaani Skinn: ${skin.name} >`, canvas.width / 2, 180);

    drawBanana(canvas.width / 2, 330, skin);

    ctx.font = '16px Arial';
    ctx.fillStyle = '#aaaa88';
    ctx.fillText("Kasuta nooli [<- / ->] skini muutmiseks", canvas.width / 2, 490);
    ctx.fillText("Vajuta [ENTER] või tee HIIRKLÕPS alustamiseks", canvas.width / 2, 520);
}

function renderGame() {
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const boardStyle = getBoardColor(level);
    const boardX = 120, boardY = 90, boardW = 560, boardH = 420;
    
    ctx.fillStyle = boardStyle.wood;
    ctx.strokeStyle = boardStyle.border;
    ctx.lineWidth = 10;
    
    drawRoundedRect(boardX, boardY, boardW, boardH, 24);
    ctx.fill();
    ctx.stroke();

    const currentSkin = BANANA_SKINS[selectedSkinIndex];
    drawBanana(canvas.width / 2, canvas.height / 2, currentSkin);

    // Mahlatilgad
    ctx.fillStyle = '#b30000';
    for (let i = juiceDrips.length - 1; i >= 0; i--) {
        let drip = juiceDrips[i];
        ctx.beginPath();
        ctx.arc(drip.x, drip.y, drip.radius, 0, Math.PI * 2);
        ctx.fill();

        drip.y += drip.speedY;
        drip.radius = Math.max(0.5, drip.radius - 0.01);
    }

    // Tehtud kriimustused
    ctx.strokeStyle = '#660000';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    cuts.forEach(c => renderStroke(c));

    // Pooleliolev kriimustus
    if (isCutting && currentCut) {
        renderStroke(currentCut);
    }

    drawKnifeObj(knife);

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, 60);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`Tase: ${level} (${boardStyle.name})`, 20, 38);

    ctx.fillStyle = cutsCount >= TARGET_CUTS ? '#2ecc71' : '#ffcc00';
    ctx.fillText(`Kriimustusi: ${cutsCount} / ${TARGET_CUTS}`, 300, 38);

    ctx.fillStyle = timeLeft <= 10 ? '#e74c3c' : '#ffffff';
    ctx.fillText(`Aeg: ${timeLeft}s`, 660, 38);

    if (!knife.isHeld) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText("Võta nuga kätte (klõpsa noale)!", canvas.width / 2, 560);
    } else {
        ctx.fillStyle = '#aaaaaa';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText("1 tõmme = 1 kriimustus | Paremklõps paneb noa ära", canvas.width / 2, 560);
    }
}

function renderGameOver() {
    ctx.fillStyle = 'rgba(15, 15, 20, 0.9)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText("AEG SAAMAS OTSA!", canvas.width / 2, 220);

    ctx.fillStyle = '#ffffff';
    ctx.font = '22px Arial';
    ctx.fillText(`Jõudsid tasemele: ${level}`, canvas.width / 2, 290);
    ctx.fillText(`Skoor selles voorus: ${cutsCount} kriimustust`, canvas.width / 2, 330);

    ctx.fillStyle = '#3498db';
    ctx.font = '18px Arial';
    ctx.fillText("Tee klõps, et minna tagasi peamenüüsse", canvas.width / 2, 440);
}

function gameLoop() {
    if (gameState === "MENU") {
        renderMenu();
    } else if (gameState === "GAME") {
        renderGame();
    } else if (gameState === "GAME_OVER") {
        renderGameOver();
    }
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
