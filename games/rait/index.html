<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boss Evader</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070c;--fg:#fff;--acc:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000}}
:root[data-theme="dark"]{--bg:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Press Start 2P',monospace;display:flex;align-items:center;justify-content:center}
#w{position:relative;width:100%;max-width:760px}
canvas{width:100%;display:block;touch-action:none;background:#000}
#m{position:absolute;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;font-size:clamp(7px,1.5vw,11px)}
button{font:inherit;color:var(--fg);background:#000;border:3px solid var(--fg);padding:8px 10px;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}
.r{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
h1{font-size:clamp(13px,3vw,24px);margin:0;color:var(--acc)}
p{margin:0;line-height:1.7;opacity:.85}
</style></head><body>
<div id="w"><canvas id="c"></canvas><div id="m"></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),M=document.getElementById('m'),W=760,H=560;
C.width=W;C.height=H;
const A={x:180,y:225,w:400,h:290},R=Math.random,pick=a=>a[R()*a.length|0],rr=(a,b)=>a+R()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
// s = attack speed multiplier, b = multiplier on damage the boss takes per missed attack, p = damage you take per hit
const DIFF={Easy:{s:.75,b:1.5,p:8},Normal:{s:1,b:1,p:12},Hard:{s:1.4,b:.65,p:16},Insane:{s:1.9,b:.4,p:22}};
const BOSSES=[
{n:'SKULLY',hp:100,c:'#eee',e:'#000',k:0,pool:['half','bones','bones','stripes','cross'],d:'Bone walls and half-arena slams'},
{n:'OCULUS',hp:120,c:'#7df',e:'#f22',k:1,pool:['laser','laser','cross','bombs','quad'],d:'Tracking lasers and bombs'},
{n:'CHAOS',hp:150,c:'#c6f',e:'#ff0',k:2,pool:['half','bones','laser','bombs','quad','stripes','cross'],d:'Every attack in one fight'}];
let sel={b:0,d:'Normal'},G=null,keys={};
const circR=(px,py,r,q)=>{const cx=cl(px,q.x,q.x+q.w),cy=cl(py,q.y,q.y+q.h);return(px-cx)**2+(py-cy)**2<r*r},
inR=(x,y,q)=>x>=q.x&&x<=q.x+q.w&&y>=q.y&&y<=q.y+q.h;
function rects(L,warn,dur){return{warn,dur,t:0,
shadow:(x,y)=>L.some(q=>inR(x,y,q)),
hit:p=>L.some(q=>circR(p.x,p.y,p.r,q)),
draw(){const w=this.t<this.warn;L.forEach(q=>{X.fillStyle=w?((this.t*8|0)%2?'#f334':'#f332'):((this.t*24|0)%2?'#fff':'#f33');X.fillRect(q.x,q.y,q.w,q.h);if(w){X.strokeStyle='#f55';X.lineWidth=2;X.strokeRect(q.x,q.y,q.w,q.h)}})}}}
const ATK={
half(s){const l=pick(['l','r','t','b']),hw=A.w/2,hh=A.h/2;
return rects([l=='l'?{x:A.x,y:A.y,w:hw,h:A.h}:l=='r'?{x:A.x+hw,y:A.y,w:hw,h:A.h}:l=='t'?{x:A.x,y:A.y,w:A.w,h:hh}:{x:A.x,y:A.y+hh,w:A.w,h:hh}],1.3/s,.7)},
quad(s){const w=A.w/2,h=A.h/2,f=R()<.5;return rects(f?[{x:A.x+w,y:A.y,w,h},{x:A.x,y:A.y+h,w,h}]:[{x:A.x,y:A.y,w,h},{x:A.x+w,y:A.y+h,w,h}],1.4/s,.7)},
stripes(s){const v=R()<.5,L=[];for(let i=0;i<3;i++){const k=(i+.5)/3,o=rr(-25,25);L.push(v?{x:A.x+A.w*k-18+o,y:A.y,w:36,h:A.h}:{x:A.x,y:A.y+A.h*k-18+o,w:A.w,h:36})}return rects(L,1.2/s,.6)},
cross(s){const x=G.P.x-20,y=G.P.y-20;return rects([{x,y:A.y,w:40,h:A.h},{x:A.x,y,w:A.w,h:40}],1.2/s,.5)},
bones(s){const d=pick([1,-1]),n=2+(R()<.5),gh=70,sp=300*s,Q=[];
for(let i=0;i<n;i++)Q.push({g:rr(A.y+8,A.y+A.h-gh-8),d:i*.6/s});
return{warn:1.2/s,dur:(n-1)*.6/s+A.w/sp+.15,t:0,
rc(w){const k=this.t-this.warn-w.d,x=d>0?A.x-30+k*sp:A.x+A.w+30-k*sp;return[{x:x-9,y:A.y,w:18,h:w.g-A.y},{x:x-9,y:w.g+gh,w:18,h:A.y+A.h-w.g-gh}]},
shadow:(x,y)=>Q.some(w=>y<w.g||y>w.g+gh),
hit(p){return Q.some(w=>this.t-this.warn>w.d&&this.rc(w).some(q=>circR(p.x,p.y,p.r,q)))},
draw(){Q.forEach(w=>{if(this.t-this.warn<w.d){X.fillStyle=(this.t*8|0)%2?'#f333':'#f332';X.fillRect(A.x,A.y,A.w,w.g-A.y);X.fillRect(A.x,w.g+gh,A.w,A.y+A.h-w.g-gh);X.fillStyle='#fff';X.fillText(d>0?'>>':'<<',d>0?A.x-30:A.x+A.w+8,w.g+gh/2+4)}else this.rc(w).forEach((q,i)=>{X.fillStyle='#fff';X.fillRect(q.x,q.y,q.w,q.h);X.fillRect(q.x-5,i?q.y:q.y+q.h-9,28,9)})})}}},
laser(s){const Bm=[0,R()<.4?rr(.5,1)*pick([-1,1]):null].filter(o=>o!==null).map(o=>({a:0,o})),bx=380,by=135,
aim=()=>Bm.forEach(b=>b.a=Math.atan2(G.P.y-by,G.P.x-bx)+b.o),
ld=(b,x,y)=>{const c=Math.cos(b.a),sn=Math.sin(b.a);return(x-bx)*c+(y-by)*sn>0?Math.abs((x-bx)*sn-(y-by)*c):999};
aim();
return{warn:1.3/s,dur:.5,t:0,
upd(){if(this.t<this.warn-.4)aim()},
shadow:(x,y)=>Bm.some(b=>ld(b,x,y)<24),
hit:p=>Bm.some(b=>ld(b,p.x,p.y)<p.r+14),
draw(){const w=this.t<this.warn;Bm.forEach(b=>{X.beginPath();X.moveTo(bx,by);X.lineTo(bx+Math.cos(b.a)*900,by+Math.sin(b.a)*900);X.lineWidth=w?2:28;X.strokeStyle=w?((this.t*10|0)%2?'#f55':'#f99'):'#f33';X.stroke();if(!w){X.lineWidth=10;X.strokeStyle='#fff';X.stroke()}})}}},
bombs(s){const P=[];for(let i=0;i<(s>1.3?6:5);i++)P.push({x:rr(A.x+30,A.x+A.w-30),y:rr(A.y+30,A.y+A.h-30),r:46});
return{warn:1.2/s,dur:.4,t:0,
shadow:(x,y)=>P.some(b=>(x-b.x)**2+(y-b.y)**2<b.r*b.r),
hit:p=>P.some(b=>(p.x-b.x)**2+(p.y-b.y)**2<(b.r+p.r)**2),
draw(){const w=this.t<this.warn;P.forEach(b=>{X.beginPath();X.arc(b.x,b.y,b.r,0,7);if(w){X.strokeStyle='#f55';X.lineWidth=2;X.stroke();X.beginPath();X.arc(b.x,b.y,b.r*this.t/this.warn,0,7);X.fillStyle='#f334'}else X.fillStyle=(this.t*24|0)%2?'#fff':'#f33';X.fill()})}}}};
// A new attack may overlap a running one only if enough safe space remains AND the player can reach it in time
function ok(a){let n=0,best=1e9;const all=G.act.concat(a);
for(let x=A.x+10;x<A.x+A.w;x+=20)for(let y=A.y+10;y<A.y+A.h;y+=20)if(!all.some(o=>o.shadow(x,y))){n++;best=Math.min(best,Math.hypot(x-G.P.x,y-G.P.y))}
return n>=70&&best<=G.P.sp*a.warn*.8}
function mv(dx,dy){const P=G.P;P.x=cl(P.x+dx,A.x+P.r+2,A.x+A.w-P.r-2);P.y=cl(P.y+dy,A.y+P.r+2,A.y+A.h-P.r-2)}
function start(){const B=BOSSES[sel.b],D=DIFF[sel.d];G={B,D,s:D.s,hp:100,bhp:B.hp,P:{x:A.x+A.w/2,y:A.y+A.h/2,r:6,sp:190},act:[],cool:1.2,inv:0,fx:[],t:0,over:0,shake:0,flash:0};M.style.display='none'}
function end(w){G.over=w?1:2;G.act=[];setTimeout(()=>menu(w?'YOU WIN!':'GAME OVER'),1300)}
function upd(dt){const g=G,P=g.P;
const dx=(keys.ArrowRight||keys.d||0)-(keys.ArrowLeft||keys.a||0),dy=(keys.ArrowDown||keys.s||0)-(keys.ArrowUp||keys.w||0),l=Math.hypot(dx,dy)||1,sp=P.sp*(keys.Shift?.5:1)*dt;
mv(dx/l*sp,dy/l*sp);
g.t+=dt;g.inv-=dt;g.cool-=dt;g.shake-=dt;g.flash-=dt;g.fx=g.fx.filter(f=>(f.t+=dt)<1);
if(g.cool<=0&&g.act.length<3){const a=ATK[pick(g.B.pool)](g.s);if(!g.act.length||ok(a)){g.act.push(a);g.cool=(a.warn+a.dur)*.55+.3/g.s}else g.cool=.25}
for(const a of g.act){a.t+=dt;a.upd&&a.upd();
if(a.t>=a.warn&&a.t<a.warn+a.dur&&a.hit(P)){a.hurt=1;if(g.inv<=0){g.hp-=g.D.p;g.inv=.9;g.shake=.25;if(g.hp<=0){g.hp=0;end(0);return}}}}
g.act=g.act.filter(a=>{if(a.t<a.warn+a.dur)return 1;
if(!a.hurt&&!g.over){const d=5*g.D.b;g.bhp-=d;g.flash=.15;g.fx.push({t:0,txt:'-'+(+d.toFixed(1))});if(g.bhp<=0){g.bhp=0;end(1)}}return 0})}
function bar(x,y,w,h,v,c){X.fillStyle='#b11';X.fillRect(x,y,w,h);X.fillStyle=c;X.fillRect(x,y,w*cl(v,0,1),h)}
function draw(){X.fillStyle='#000';X.fillRect(0,0,W,H);if(!G)return;
const g=G,B=g.B,bx=380,by=125+Math.sin(g.t*2)*5;X.font='10px "Press Start 2P",monospace';
X.save();if(g.shake>0)X.translate(rr(-4,4),rr(-4,4));
X.fillStyle=g.flash>0?'#f66':B.c;
if(B.k==0){X.fillRect(bx-45,by-40,90,70);X.fillRect(bx-30,by+30,60,22)}
else if(B.k==1){X.beginPath();X.arc(bx,by,50,0,7);X.fill()}
else{X.save();X.translate(bx,by);X.rotate(Math.PI/4);X.fillRect(-38,-38,76,76);X.restore()}
X.fillStyle=B.e;if(B.k==1){X.beginPath();X.arc(bx,by,22,0,7);X.fill();X.fillStyle='#000';X.fillRect(bx-4,by-12,8,24)}
else{X.fillRect(bx-30,by-20,18,18);X.fillRect(bx+12,by-20,18,18);X.fillStyle='#000';for(let i=0;i<5;i++)X.fillRect(bx-28+i*12,by+10,6,14)}
X.fillStyle='#fff';X.fillText(B.n,A.x,24);bar(A.x+110,12,A.w-110,14,g.bhp/B.hp,'#3d5');
X.strokeStyle='#fff';X.lineWidth=5;X.strokeRect(A.x-2,A.y-2,A.w+4,A.h+4);
g.act.forEach(a=>a.draw());
const P=g.P;if(g.inv<=0||(g.t*20|0)%2){X.fillStyle='#3f6';X.fillRect(P.x-4,P.y-7,8,7);X.fillRect(P.x-3,P.y,6,5);X.fillRect(P.x-4,P.y+5,3,3);X.fillRect(P.x+1,P.y+5,3,3);X.fillStyle='#000';X.fillRect(P.x-2,P.y-5,2,2);X.fillRect(P.x+1,P.y-5,2,2)}
g.fx.forEach(f=>{X.globalAlpha=1-f.t;X.fillStyle='#ffd23f';X.fillText(f.txt,bx+60,100-f.t*30)});X.globalAlpha=1;X.restore();
X.fillStyle='#fff';X.fillText('HP',A.x,547);bar(A.x+36,534,200,16,g.hp/100,'#ff0');X.fillStyle='#fff';X.fillText(Math.ceil(g.hp)+' / 100',A.x+248,547)}
const btn=(t,on,f)=>{const b=document.createElement('button');b.textContent=t;b.className=on?'on':'';b.onclick=f;return b};
function menu(msg){M.style.display='flex';const D=DIFF[sel.d];
M.innerHTML=`<h1>${msg}</h1><p>Arrows / WASD to move, Shift to slow down, or drag on touch.<br>Every attack that misses you damages the boss.</p><div class=r></div><p>${BOSSES[sel.b].d}</p><div class=r></div><p>Attack speed x${D.s}, boss damage taken x${D.b}</p><button class=on>FIGHT</button>`;
const[r1,r2]=M.querySelectorAll('.r');
BOSSES.forEach((b,i)=>r1.append(btn(b.n,i==sel.b,()=>{sel.b=i;menu(msg)})));
Object.keys(DIFF).forEach(k=>r2.append(btn(k,k==sel.d,()=>{sel.d=k;menu(msg)})));
M.lastChild.onclick=start}
onkeydown=e=>{if(e.key.startsWith('Arrow'))e.preventDefault();keys[e.key.length>1?e.key:e.key.toLowerCase()]=1;if(e.key=='Enter'&&M.style.display!='none')start()};
onkeyup=e=>delete keys[e.key.length>1?e.key:e.key.toLowerCase()];
let lp=null;C.onpointerdown=e=>lp=e;C.onpointerup=()=>lp=null;
C.onpointermove=e=>{if(lp&&G&&!G.over){const k=W/C.getBoundingClientRect().width;mv((e.clientX-lp.clientX)*k,(e.clientY-lp.clientY)*k);lp=e}};
let lt=0;(function L(t){const dt=Math.min((t-lt)/1000,.033)||0;lt=t;if(G&&!G.over)upd(dt);draw();requestAnimationFrame(L)})(0);
menu('BOSS EVADER');
</script></body></html>
