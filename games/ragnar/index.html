
<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<title>Horse Racing 🐎</title>
<style>
body {
  background: #164b2b;
  color: white;
  font-family: Arial;
  text-align: center;
}
button {
  padding: 10px;
  margin: 5px;
  cursor: pointer;
}
.track {
  background: #b58b54;
  padding: 12px;
  margin: 8px;
  font-size: 24px;
}
</style>
</head>
<body>

<h1>🐎 Horse Racing</h1>
<h2>Raha: $<span id="money">100</span></h2>

<p>Vali hobune ja panusta!</p>
<select id="horse">
  <option value="0">🐎 Välk (2x)</option>
  <option value="1">🐴 Äike (3x)</option>
  <option value="2">🏇 Torm (5x)</option>
</select>

<br><br>
<input id="bet" type="number" min="1"
placeholder="Panus $" value="10">
<button onclick="race()">Alusta võistlust!</button>

<h3 id="result">Valmis võistluseks?</h3>
<div id="track"></div>

<script>
let money = 100;

function race() {
  let bet = Number(document.getElementById("bet").value);
  let chosen = Number(document.getElementById("horse").value);

  if (bet <= 0 || bet > money) {
    alert("Sul pole piisavalt raha!");
    return;
  }

  money -= bet;

  let winner = Math.floor(Math.random() * 3);
  let horses = ["🐎 Välk", "🐴 Äike", "🏇 Torm"];
  let odds = [2, 3, 5];

  document.getElementById("track").innerHTML =
    horses.map((h, i) =>
      `<div class="track">${h} ${
        i === winner ? "🏆 VÕITJA!" : "🏁"
      }</div>`
    ).join("");

  if (chosen === winner) {
    let prize = bet * odds[winner];
    money += prize;
    document.getElementById("result").innerText =
      "Võitsid $" + prize + "! 🎉";
  } else {
    document.getElementById("result").innerText =
      "Kaotasid panuse! Võitis " + horses[winner];
  }

  document.getElementById("money").innerText = money;
}
</script>

</body>
</html>
