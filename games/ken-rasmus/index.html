
<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Põgenemine ruumist</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #090b10;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}
h1 { margin: 12px; font-size: 25px; }
#game {
  position: relative;
  height: 70vh;
  max-height: 550px;
  margin: auto;
  overflow: hidden;
  background: linear-gradient(#222a35, #11151c);
  border: 3px solid #444;
}
.wall {
  position: absolute;
  top: 8%;
  left: 12%;
  width: 76%;
  height: 72%;
  background: linear-gradient(90deg,#555b63,#777e85,#4a5058);
  border: 8px solid #383e45;
  box-shadow: inset 0 0 35px #111;
  transition: .15s;
}
.floor {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 25%;
  background: repeating-linear-gradient(
    90deg,#282c32 0px,#282c32 2px,
    #343941 3px,#343941 90px);
  clip-path: polygon(0 0,100% 0,100% 100%,0 100%);
}
.light {
  position: absolute;
  top: 0;
  left: 35%;
  width: 30%;
  height: 80%;
  background: #fff;
  opacity: .06;
  filter: blur(25px);
}
.crack {
  position: absolute;
  width: 3px;
  height: 70px;
  background: #171a1e;
  transform: rotate(35deg);
}
#fist {
  position: absolute;
  bottom: 5%;
  left: 50%;
  font-size: 85px;
  transform: translateX(-50%);
  transition: .12s;
  filter: drop-shadow(0 5px 5px #000);
}
#message {
  position: absolute;
  top: 42%;
  width: 100%;
  font-size: 25px;
  font-weight: bold;
  text-shadow: 2px 2px black;
  pointer-events: none;
}
#stats { padding: 8px; }
.bar {
  height: 14px;
  background: #333;
  margin: 5px auto 12px;
  max-width: 320px;
  border-radius: 8px;
  overflow: hidden;
}
#progress {
  height: 100%;
  width: 100%;
  background: #e94b43;
  transition: width .2s;
}
button {
  background: #d94235;
  color: white;
  border: 0;
  padding: 14px 25px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
  margin: 5px;
}
button:active { transform: scale(.94); }
#result { font-size: 20px; margin: 8px; }
.shake { animation: shake .15s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
</style>
</head>
<body>
<h1>👊 PÕGENEMINE RUUMIST</h1>
<div id="stats">
  Seina tugevus: <span id="health">100</span>%
  <div class="bar"><div id="progress"></div></div>
  Löögid: <span id="hits">0</span>
</div>
<div id="game">
  <div class="light"></div>
  <div class="wall" id="wall"></div>
  <div class="floor"></div>
  <div id="fist">👊</div>
  <div id="message">Sa oled lõksus...</div>
</div>
<div id="result">Leia väljapääs. Löö seina!</div>
<button id="punch">👊 LÖÖ SEINA!</button>
<button id="restart">🔄 ALUSTA UUESTI</button>
<script>
const wall = document.getElementById("wall");
const fist = document.getElementById("fist");
const game = document.getElementById("game");
const healthText = document.getElementById("health");
const progress = document.getElementById("progress");
const hitsText = document.getElementById("hits");
const message = document.getElementById("message");
const result = document.getElementById("result");
let health = 100;
let hits = 0;
let finished = false;

function punch() {
  if (finished) return;

  hits++;
  health -= Math.floor(Math.random() * 7) + 8;
  health = Math.max(0, health);

  hitsText.textContent = hits;
  healthText.textContent = health;
  progress.style.width = health + "%";

  fist.style.bottom = "25%";
  fist.style.fontSize = "105px";
  wall.style.filter = "brightness(1.8)";
  game.classList.remove("shake");
  void game.offsetWidth;
  game.classList.add("shake");

  setTimeout(() => {
    fist.style.bottom = "5%";
    fist.style.fontSize = "85px";
    wall.style.filter = "brightness(1)";
  }, 120);

  if (health < 70) wall.style.background =
    "linear-gradient(90deg,#494e55,#656a70,#444950)";
  if (health < 40) wall.style.borderColor = "#222";

  if (health <= 0) {
    finished = true;
    wall.style.transform = "scale(0.1)";
    wall.style.opacity = "0";
    message.textContent = "🚪 VÄLJAPÄÄS!";
    message.style.color = "#5dff85";
    result.textContent =
      "Sa murdsid seina ja pääsesid vabadusse! Lööke: " + hits;
    fist.textContent = "🎉";
  } else {
    message.textContent =
      health < 40 ? "Sein hakkab lagunema!" :
      health < 70 ? "Seina tekivad praod!" :
      "PÕMM! Löö veel!";
    result.textContent = "Sein sai pihta! Ära anna alla!";
  }
}

function restart() {
  health = 100;
  hits = 0;
  finished = false;
  healthText.textContent = health;
  hitsText.textContent = hits;
  progress.style.width = "100%";
  wall.style.opacity = "1";
  wall.style.transform = "scale(1)";
  wall.style.filter = "brightness(1)";
  wall.style.borderColor = "#383e45";
  wall.style.background =
    "linear-gradient(90deg,#555b63,#777e85,#4a5058)";
  message.textContent = "Sa oled lõksus...";
  message.style.color = "white";
  fist.textContent = "👊";
  result.textContent = "Leia väljapääs. Löö seina!";
}

document.getElementById("punch").addEventListener("click", punch);
document.getElementById("restart").addEventListener("click", restart);

document.addEventListener("keydown", event => {
  if (event.code === "Space" || event.code === "Enter") {
    event.preventDefault();
    punch();
  }
});
</script>
</body>
</html>
